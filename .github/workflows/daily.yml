name: Refresh Admin API tracking

on:
  schedule:
    # 07:00 UTC = 09:00 Europe/Brussels (CEST). Runs daily.
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ github.token }}   # gh reads public PrestaShop repos with this
        run: python3 admin-api-tracking.gen.py admin-api-tracking.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-api-tracking.html
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "chore: daily refresh $(date -u +%F)"
            git push
          fi

