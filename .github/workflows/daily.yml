name: Refresh Admin API tracking

on:
  schedule:
    - cron: '0 * * * *'      # every hour, on the hour (UTC) — commits only when data changed
  workflow_dispatch: {}       # bouton "Run workflow" manuel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 admin-api-tracking.gen.py admin-api-tracking.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-api-tracking.html
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "chore: daily refresh $(date -u +%F)"
            git push
          fi
